[package]
name = "tunex-dataset"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/shregar1/dataset.tunex.vexarr.com"
description = "High-performance Rust dataset loading engine for TuneX with mmap, zero-copy parsing, SIMD JSON, streaming, and compression support"

[dependencies]
arrow = "58.3.0"
async-trait = "0.1.89"
bytes = "1.11.1"
crossbeam-channel = "0.5.15"
lz4_flex = "0.13.1"
memmap2 = "0.9.10"
metrics = "0.24.6"
parquet = "58.3.0"
rand = "0.10.1"
rand_chacha = "0.10.0"
rayon = "1.12.0"
regex = "1.12.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
simd-json = "0.17.0"
smallvec = "1.15.1"
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tunex-core = { version = "0.1.0", path = "../core.tunex.vexarr.com" }
zstd = "0.13.3"

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "jsonl_parse"
harness = false

[[bench]]
name = "pipeline"
harness = false

[[bench]]
name = "batching"
harness = false

[[bench]]
name = "mmap_read"
harness = false

[[bench]]
name = "simd_parse"
harness = false

[[bench]]
name = "compression"
harness = false

[[bench]]
name = "shuffle"
harness = false

[[bench]]
name = "cache"
harness = false

[[bench]]
name = "distributed"
harness = false

[[bench]]
name = "end_to_end"
harness = false
